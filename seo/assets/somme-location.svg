<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1038" viewBox="0 0 640 692" role="img" aria-labelledby="title desc">
  <title id="title">The Somme battlefield, northern France, 1916</title>
  <desc id="desc">North-up locator of Gommecourt, Thiepval, Pozières and Dompierre relative to Albert, Bapaume, Péronne, Maricourt, Bray-sur-Somme and the River Somme. The main road connects Albert and Bapaume through Pozières. It covers the local geography of the battle of 1 July to 18 November 1916. A separate inset places the area in France.</desc>
  <metadata>Original map by Chronica Maps, licensed under GPL-3.0. Settlement coordinates: GeoNames, https://www.geonames.org/ (CC BY). France inset: France in 2010, historical-basemaps, https://github.com/aourednik/historical-basemaps (GPL-3.0). Campaign geography: Canadian Army official history, Canadian Expeditionary Force 1914–1919, chapter VI and Map 5. Hydrography: schematic river corridor referenced to the Département de la Somme valley map between Péronne and Froissy, https://www.somme.fr/wp-content/uploads/2019/07/CV2_Peronne-Froissy.pdf. The main map is equirectangular at 50° N, with 16.8 viewBox units/km. Settlement coordinates are recorded in each marker title.</metadata>
